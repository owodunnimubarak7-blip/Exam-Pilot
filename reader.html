<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#030b29">

<title>Note Reader | Exam Pilot</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>
:root {
  --bg: #030b29;
  --panel: #091a40;
  --panel2: #102650;
  --text: #f4f7ff;
  --muted: #9aaccb;
  --green: #00ed8b;
  --blue: #4388ff;
  --border: rgba(255,255,255,.09);
  --shadow: 0 15px 45px rgba(0,0,0,.18);
}

body.light {
  --bg: #f3f6fc;
  --panel: #ffffff;
  --panel2: #edf2fb;
  --text: #102044;
  --muted: #66748f;
  --green: #00a96b;
  --blue: #2563eb;
  --border: rgba(15,35,75,.12);
  --shadow: 0 12px 35px rgba(20,40,80,.08);
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: 'Manrope', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  transition: background .25s, color .25s;
}

button, input {
  font: inherit;
}

button {
  cursor: pointer;
}

a {
  color: inherit;
  text-decoration: none;
}

/* TOPBAR */

.topbar {
  height: 75px;
  padding: 0 6%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: var(--panel);
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
  z-index: 100;
}

.brand {
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: 19px;
  font-weight: 800;
}

.brand-icon {
  width: 42px;
  height: 42px;
  display: grid;
  place-items: center;
  border-radius: 13px;
  background: var(--green);
  color: #03152c;
}

.brand span {
  color: var(--green);
}

.top-actions {
  display: flex;
  gap: 12px;
}

.icon-btn {
  width: 42px;
  height: 42px;
  border: 1px solid var(--border);
  background: var(--panel2);
  color: var(--text);
  border-radius: 12px;
  display: grid;
  place-items: center;
  font-size: 17px;
}

.icon-btn:hover {
  color: var(--green);
  border-color: var(--green);
}

.menu-btn {
  display: none;
}

/* NAVIGATION DRAWER */

.nav-drawer {
  position: fixed;
  top: 75px;
  right: 0;
  width: 290px;
  max-width: 85%;
  height: calc(100vh - 75px);
  background: var(--panel);
  border-left: 1px solid var(--border);
  padding: 25px;
  z-index: 99;
  transform: translateX(110%);
  transition: transform .3s ease;
  box-shadow: var(--shadow);
}

.nav-drawer.open {
  transform: translateX(0);
}

.nav-drawer h3 {
  font-size: 13px;
  color: var(--muted);
  margin-bottom: 18px;
  text-transform: uppercase;
  letter-spacing: 1px;
}

.nav-link {
  display: flex;
  align-items: center;
  gap: 13px;
  padding: 15px;
  border-radius: 12px;
  margin-bottom: 8px;
  font-size: 14px;
  font-weight: 700;
}

.nav-link:hover,
.nav-link.active {
  background: var(--panel2);
  color: var(--green);
}

.drawer-overlay {
  position: fixed;
  inset: 75px 0 0;
  background: rgba(0,0,0,.45);
  z-index: 98;
  display: none;
}

.drawer-overlay.show {
  display: block;
}

/* MAIN */

.container {
  width: 88%;
  max-width: 1250px;
  margin: auto;
  padding-top: 35px;
}

.back-row {
  display: flex;
  align-items: center;
  gap: 18px;
  flex-wrap: wrap;
  margin-bottom: 24px;
}

.back-link {
  display: inline-flex;
  gap: 9px;
  align-items: center;
  color: var(--muted);
  font-size: 12px;
  font-weight: 700;
}

.back-link:hover {
  color: var(--green);
}

.reader-card {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 19px;
  padding: 25px;
  box-shadow: var(--shadow);
}

.reader-top {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 18px;
  flex-wrap: wrap;
  padding-bottom: 20px;
  border-bottom: 1px solid var(--border);
}

.eyebrow {
  color: var(--green);
  font-size: 12px;
  font-weight: 800;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  margin-bottom: 8px;
}

.reader-top h1 {
  font-size: clamp(22px, 3.5vw, 32px);
  line-height: 1.25;
  font-weight: 800;
}

.reader-top p {
  color: var(--muted);
  font-size: 13px;
  line-height: 1.7;
  margin-top: 8px;
  max-width: 720px;
}

.reader-actions {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}

.action-btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 10px 14px;
  border-radius: 10px;
  border: 1px solid var(--border);
  background: var(--panel2);
  color: var(--text);
  font-size: 12px;
  font-weight: 700;
}

.action-btn:hover {
  border-color: var(--green);
  color: var(--green);
}

.action-btn.primary {
  background: var(--green);
  color: #03152c;
  border-color: var(--green);
  font-weight: 800;
}

.action-btn.primary:hover {
  color: #03152c;
  opacity: .92;
}

.favourite-btn {
  width: 40px;
  height: 40px;
  border-radius: 10px;
  border: 1px solid var(--border);
  background: var(--panel2);
  color: var(--muted);
  font-size: 17px;
  display: grid;
  place-items: center;
}

.favourite-btn.saved {
  color: #ffca52;
  border-color: rgba(255, 202, 82, .45);
}

.tags-row {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 16px;
}

.tag-chip {
  background: var(--panel2);
  border: 1px solid var(--border);
  color: var(--muted);
  font-size: 11px;
  font-weight: 700;
  padding: 5px 10px;
  border-radius: 999px;
}

.viewer-wrap {
  margin-top: 22px;
}

.pdf-frame {
  width: 100%;
  height: 75vh;
  min-height: 480px;
  border: 1px solid var(--border);
  border-radius: 14px;
  background: var(--panel2);
}

.notice-box {
  background: var(--panel2);
  border: 1px dashed var(--border);
  border-radius: 14px;
  padding: 40px 24px;
  text-align: center;
  color: var(--muted);
  line-height: 1.8;
  font-size: 13px;
}

.notice-box i {
  display: block;
  font-size: 30px;
  color: var(--green);
  margin-bottom: 14px;
}

.notice-box h2 {
  color: var(--text);
  font-size: 18px;
  margin-bottom: 8px;
}

/* FOOTER */

footer {
  border-top: 1px solid var(--border);
  margin-top: 45px;
  padding: 30px 6%;
  text-align: center;
  color: var(--muted);
  font-size: 12px;
  line-height: 1.8;
}

footer strong {
  color: var(--green);
}

/* RESPONSIVE */

@media(max-width: 600px) {
  .topbar {
    height: 67px;
    padding: 0 5%;
  }

  .brand {
    font-size: 15px;
  }

  .brand-icon {
    width: 37px;
    height: 37px;
  }

  .menu-btn {
    display: grid;
  }

  .container {
    width: 90%;
    padding-top: 24px;
  }

  .reader-card {
    padding: 16px;
  }

  .pdf-frame {
    height: 62vh;
    min-height: 360px;
  }

  .nav-drawer {
    top: 67px;
    height: calc(100vh - 67px);
  }

  .drawer-overlay {
    top: 67px;
  }
}
</style>
</head>

<body>

<header class="topbar">

  <a href="index.html" class="brand">
    <div class="brand-icon">
      <i class="fas fa-graduation-cap"></i>
    </div>
    <div>EXAM <span>PILOT</span></div>
  </a>

  <div class="top-actions">

    <button class="icon-btn" id="themeToggle"
      aria-label="Toggle theme" title="Toggle theme">
      <i class="fas fa-sun"></i>
    </button>

    <button class="icon-btn menu-btn" id="menuToggle"
      aria-label="Open menu" aria-expanded="false">
      <i class="fas fa-bars"></i>
    </button>

  </div>
</header>

<div class="drawer-overlay" id="drawerOverlay"></div>

<aside class="nav-drawer" id="navDrawer">

  <h3>Navigation</h3>

  <a href="index.html" class="nav-link">
    <i class="fas fa-house"></i> Home
  </a>

  <a href="practice.html" class="nav-link">
    <i class="fas fa-pen-to-square"></i> Practice Centre
  </a>

  <a href="study-library.html" class="nav-link">
    <i class="fas fa-book-open"></i> Study Library
  </a>

  <a href="study-notes.html" class="nav-link active">
    <i class="fas fa-book"></i> Study Notes
  </a>

  <a href="cbt.html" class="nav-link">
    <i class="fas fa-laptop"></i> CBT Examination
  </a>

</aside>

<main class="container">

  <div class="back-row">
    <a href="study-notes.html" class="back-link" id="backToSubjectLink">
      <i class="fas fa-arrow-left"></i>
      Back to Study Notes
    </a>
  </div>

  <section class="reader-card" id="readerCard">
    <div class="notice-box">
      <i class="fas fa-spinner fa-spin"></i>
      Loading study material...
    </div>
  </section>

</main>

<footer>
  <strong>EXAM PILOT</strong><br>
  Learn. Practise. Improve. Succeed.
</footer>

<script>

/* =====================================
   THEME MANAGEMENT
===================================== */

const themeToggle = document.getElementById("themeToggle");

function applyTheme(theme) {
  document.body.classList.toggle("light", theme === "light");

  themeToggle.innerHTML = theme === "light"
    ? '<i class="fas fa-moon"></i>'
    : '<i class="fas fa-sun"></i>';

  localStorage.setItem("examPilotTheme", theme);
}

applyTheme(localStorage.getItem("examPilotTheme") || "dark");

themeToggle.addEventListener("click", () => {
  applyTheme(
    document.body.classList.contains("light") ? "dark" : "light"
  );
});


/* =====================================
   NAVIGATION MENU
===================================== */

const menuToggle = document.getElementById("menuToggle");
const navDrawer = document.getElementById("navDrawer");
const drawerOverlay = document.getElementById("drawerOverlay");

function closeMenu() {
  navDrawer.classList.remove("open");
  drawerOverlay.classList.remove("show");
  menuToggle.setAttribute("aria-expanded", "false");
  menuToggle.innerHTML = '<i class="fas fa-bars"></i>';
}

menuToggle.addEventListener("click", () => {
  const isOpen = navDrawer.classList.contains("open");

  if (isOpen) {
    closeMenu();
  } else {
    navDrawer.classList.add("open");
    drawerOverlay.classList.add("show");
    menuToggle.setAttribute("aria-expanded", "true");
    menuToggle.innerHTML = '<i class="fas fa-times"></i>';
  }
});

drawerOverlay.addEventListener("click", closeMenu);

document.querySelectorAll(".nav-link").forEach(link => {
  link.addEventListener("click", closeMenu);
});

document.addEventListener("keydown", event => {
  if (event.key === "Escape") closeMenu();
});


/* =====================================
   SAFE & FAVOURITE HELPERS
===================================== */

function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>"']/g, char => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  })[char]);
}

function getMaterialId(material) {
  return String(
    material.id ||
    material.file ||
    material.pdf ||
    material.title ||
    ""
  );
}

function getFavourites() {
  try {
    return JSON.parse(
      localStorage.getItem("examPilotFavourites") || "[]"
    );
  } catch {
    return [];
  }
}

function saveFavourites(items) {
  localStorage.setItem(
    "examPilotFavourites",
    JSON.stringify(items)
  );
}


/* =====================================
   RENDER READER
===================================== */

const readerCard = document.getElementById("readerCard");
const backToSubjectLink = document.getElementById("backToSubjectLink");

function renderNotFound(message) {
  readerCard.innerHTML = `
    <div class="notice-box">
      <i class="fas fa-circle-exclamation"></i>
      <h2>Study Material Unavailable</h2>
      <p>${escapeHTML(message)}</p>
      <div style="margin-top: 18px;">
        <a href="study-notes.html" class="action-btn primary">
          <i class="fas fa-arrow-left"></i> Browse All Study Notes
        </a>
      </div>
    </div>
  `;
}

async function renderMaterial(material, forceShowViewer = false) {
  const id = getMaterialId(material);
  const filePath = material.file || material.pdf || "";
  const isPlaceholder = String(material.status || "").toLowerCase() === "placeholder";
  const saved = getFavourites().includes(id);
  const tags = Array.isArray(material.tags) ? material.tags : [];

  document.title = `${material.title || "Note Reader"} | Exam Pilot`;

  if (material.subject) {
    backToSubjectLink.href =
      `study-notes.html?subject=${encodeURIComponent(material.subject)}`;
    backToSubjectLink.innerHTML =
      `<i class="fas fa-arrow-left"></i> Back to ${escapeHTML(material.subject)} Notes`;
  }

  let fileExists = false;
  if (filePath && (!isPlaceholder || forceShowViewer)) {
    try {
      const headRes = await fetch(filePath, { method: "HEAD" });
      fileExists = headRes.ok;
    } catch {
      fileExists = false;
    }
  }

  const viewerMarkup = filePath && (!isPlaceholder || forceShowViewer) && fileExists
    ? `
      <div class="viewer-wrap">
        <iframe
          class="pdf-frame"
          src="${escapeHTML(filePath)}"
          title="${escapeHTML(material.title || "Study Note PDF")}">
        </iframe>
      </div>
    `
    : `
      <div class="viewer-wrap">
        <div class="notice-box">
          <i class="fas ${isPlaceholder ? "fa-clock" : "fa-file-pdf"}"></i>
          <h2>${isPlaceholder ? "Study Note Coming Soon" : "PDF File Not Found Yet"}</h2>
          <p>
            ${
              isPlaceholder
                ? `This note is currently marked as a placeholder in <strong>catalog.json</strong> (${escapeHTML(filePath || "no file path")}).`
                : `Could not locate <strong>${escapeHTML(filePath || "the PDF file")}</strong> on the server.`
            }
          </p>
          ${
            isPlaceholder && filePath && !forceShowViewer
              ? `
                <div style="margin-top: 16px;">
                  <button type="button" class="action-btn" id="tryLoadAnyway">
                    <i class="fas fa-eye"></i> Try Opening File Anyway
                  </button>
                </div>
              `
              : ""
          }
        </div>
      </div>
    `;

  readerCard.innerHTML = `
    <div class="reader-top">
      <div>
        <div class="eyebrow">
          <i class="fas fa-book-open"></i>
          ${escapeHTML(material.subject || "Study Material")}${material.year ? " • " + escapeHTML(material.year) : ""}
        </div>
        <h1>${escapeHTML(material.title || "Untitled Study Note")}</h1>
        <p>${escapeHTML(material.description || "Study material from Exam Pilot.")}</p>
      </div>

      <div class="reader-actions">
        <button
          type="button"
          class="favourite-btn ${saved ? "saved" : ""}"
          id="readerFavBtn"
          aria-label="Toggle favourite">
          <i class="${saved ? "fas" : "far"} fa-star"></i>
        </button>

        ${
          filePath
            ? `
              <a
                href="${escapeHTML(filePath)}"
                target="_blank"
                rel="noopener noreferrer"
                class="action-btn primary">
                <i class="fas fa-up-right-from-square"></i> Open PDF
              </a>
            `
            : ""
        }
      </div>
    </div>

    ${
      tags.length
        ? `
          <div class="tags-row">
            ${tags.map(tag => `<span class="tag-chip">#${escapeHTML(tag)}</span>`).join("")}
          </div>
        `
        : ""
    }

    ${viewerMarkup}
  `;

  document.getElementById("readerFavBtn").addEventListener("click", () => {
    let favs = getFavourites();
    if (favs.includes(id)) {
      favs = favs.filter(item => item !== id);
    } else {
      favs.push(id);
    }
    saveFavourites(favs);
    renderMaterial(material, forceShowViewer);
  });

  const tryLoadBtn = document.getElementById("tryLoadAnyway");
  if (tryLoadBtn) {
    tryLoadBtn.addEventListener("click", () => {
      renderMaterial(material, true);
    });
  }
}

async function initReader() {
  const params = new URLSearchParams(window.location.search);
  const targetId = params.get("id");

  if (!targetId) {
    renderNotFound("No note ID was provided in the URL.");
    return;
  }

  try {
    const response = await fetch("catalog.json", { cache: "no-cache" });
    if (!response.ok) {
      throw new Error("Failed to load catalog.json");
    }

    const data = await response.json();
    const materials = Array.isArray(data)
      ? data
      : Array.isArray(data.materials)
        ? data.materials
        : [];

    const material = materials.find(item => getMaterialId(item) === targetId);

    if (!material) {
      renderNotFound(`No study material matched ID "${targetId}".`);
      return;
    }

    await renderMaterial(material, false);
  } catch (error) {
    console.warn("Reader error:", error);
    renderNotFound("Could not load catalog.json. Make sure you are running this site on a local or web server.");
  }
}

initReader();

</script>

</body>
</html>
